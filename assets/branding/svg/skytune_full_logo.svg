<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="logoSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#5B4BFF"/>
    </linearGradient>
    <linearGradient id="logoSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
    <linearGradient id="cyanWordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
  </defs>

  <!-- Left Icon (scaled and centered within 200x200 box) -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="46" fill="url(#logoSkyGrad)"/>
    <!-- Crescent Sun -->
    <circle cx="145" cy="57" r="13" fill="url(#logoSunGrad)"/>
    <circle cx="139" cy="54" r="10" fill="url(#logoSkyGrad)"/>

    <!-- Wave Bars -->
    <rect x="68" y="76" width="11" height="38" rx="5.5" fill="#FFFFFF"/>
    <rect x="87" y="56" width="11" height="58" rx="5.5" fill="#FFFFFF"/>
    <rect x="105" y="68" width="11" height="46" rx="5.5" fill="#FFFFFF"/>
    <rect x="124" y="84" width="11" height="30" rx="5.5" fill="#FFFFFF"/>

    <!-- Cloud Base -->
    <path d="M 56 137
             L 144 137
             A 18 18 0 0 0 149 102
             A 25 25 0 0 0 124 90
             A 30 30 0 0 0 76 94
             A 22 22 0 0 0 56 115
             A 22 22 0 0 0 56 137 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- SkyTune Wordmark -->
  <g transform="translate(250, 145)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Poppins', sans-serif" font-size="96" font-weight="700" letter-spacing="-1.5">
    <text x="0" y="0" fill="#FFFFFF">Sky</text>
    <text x="175" y="0" fill="url(#cyanWordGrad)">Tune</text>
  </g>
</svg>
