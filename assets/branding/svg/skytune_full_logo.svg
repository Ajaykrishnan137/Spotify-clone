<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="logoSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#5B4BFF"/>
    </linearGradient>
    <linearGradient id="cyanWordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (200x200) -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="46" fill="url(#logoSkyGrad)"/>
    <g fill="#FFFFFF">
      <rect x="50" y="62" width="13" height="52" rx="6.5"/>
      <rect x="72" y="44" width="13" height="88" rx="6.5"/>
      <rect x="94" y="70" width="13" height="60" rx="6.5"/>
      <rect x="116" y="68" width="13" height="88" rx="6.5"/>
      <rect x="138" y="86" width="13" height="52" rx="6.5"/>
    </g>
    <path d="M 56 62 A 22 22 0 0 1 100 70" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 100 130 A 22 22 0 0 1 144 138" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- SkyTune Wordmark -->
  <g transform="translate(250, 145)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Poppins', sans-serif" font-size="96" font-weight="700" letter-spacing="-1.5">
    <text x="0" y="0" fill="#FFFFFF">Sky</text>
    <text x="175" y="0" fill="url(#cyanWordGrad)">Tune</text>
  </g>
</svg>
