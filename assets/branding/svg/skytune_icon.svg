<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#5B4BFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square App Icon Background with Sky Gradient -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)"/>

  <!-- Geometric Soundwave 'S' Pattern -->
  <g fill="#FFFFFF">
    <!-- 5 Precision Vertical Equalizer Bars -->
    <!-- Bar 1 (Left Upper) -->
    <rect x="130" y="160" width="32" height="130" rx="16"/>
    <!-- Bar 2 (Peak Left) -->
    <rect x="185" y="115" width="32" height="220" rx="16"/>
    <!-- Bar 3 (Center Pivot) -->
    <rect x="240" y="180" width="32" height="152" rx="16"/>
    <!-- Bar 4 (Peak Right) -->
    <rect x="295" y="175" width="32" height="220" rx="16"/>
    <!-- Bar 5 (Right Lower) -->
    <rect x="350" y="220" width="32" height="130" rx="16"/>
  </g>

  <!-- Connecting Rhythmic Frequency Arcs Forming the Flow of 'S' -->
  <path d="M 146 160 A 55 55 0 0 1 256 180" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M 256 332 A 55 55 0 0 1 366 350" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
</svg>
