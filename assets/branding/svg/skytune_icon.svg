<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#5B4BFF"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)"/>

  <!-- Crescent Sun / Accent Note in the upper sky -->
  <circle cx="370" cy="145" r="32" fill="url(#sunGrad)"/>
  <circle cx="356" cy="138" r="26" fill="url(#skyGrad)"/>

  <!-- Sound Wave Bars Rising from the Cloud (4 rounded bars) -->
  <!-- Bar 1 -->
  <rect x="175" y="195" width="28" height="95" rx="14" fill="#FFFFFF"/>
  <!-- Bar 2 (tallest central harmonic) -->
  <rect x="222" y="145" width="28" height="145" rx="14" fill="#FFFFFF"/>
  <!-- Bar 3 (rhythm bar) -->
  <rect x="269" y="175" width="28" height="115" rx="14" fill="#FFFFFF"/>
  <!-- Bar 4 (trailing melody bar) -->
  <rect x="316" y="215" width="28" height="75" rx="14" fill="#FFFFFF"/>

  <!-- Minimal Modern Cloud Base merging with Sound Waves -->
  <path d="M 145 350
           L 367 350
           A 46 46 0 0 0 380 262
           A 64 64 0 0 0 315 230
           A 76 76 0 0 0 195 240
           A 55 55 0 0 0 145 295
           A 55 55 0 0 0 145 350 Z"
        fill="#FFFFFF"/>
</svg>
