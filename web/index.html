<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SkyTune - Stream and download licensed, legal music with seamless background audio playback.">
  <meta name="theme-color" content="#0B1026">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkyTune">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <title>SkyTune</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B1026;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    // SkyTune Web / PWA navigator.mediaSession bridge
    window.updateSkyTuneMediaSession = function(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'SkyTune',
          artist: track.artist || 'SkyTune',
          album: track.album || 'SkyTune Music',
          artwork: [
            { src: track.artwork || 'icons/Icon-192.png', sizes: '96x96', type: 'image/png' },
            { src: track.artwork || 'icons/Icon-192.png', sizes: '128x128', type: 'image/png' },
            { src: track.artwork || 'icons/Icon-512.png', sizes: '256x256', type: 'image/png' },
            { src: track.artwork || 'icons/Icon-512.png', sizes: '512x512', type: 'image/png' }
          ]
        });

        const actions = [
          ['play', () => window.dispatchEvent(new CustomEvent('skytune-play'))],
          ['pause', () => window.dispatchEvent(new CustomEvent('skytune-pause'))],
          ['previoustrack', () => window.dispatchEvent(new CustomEvent('skytune-previous'))],
          ['nexttrack', () => window.dispatchEvent(new CustomEvent('skytune-next'))],
          ['seekto', (details) => {
            window.dispatchEvent(new CustomEvent('skytune-seek', { detail: details.seekTime }));
          }]
        ];

        for (const [action, handler] of actions) {
          try {
            navigator.mediaSession.setActionHandler(action, handler);
          } catch (e) {}
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
