name: wavely
description: "A production-grade, Spotify-style music streaming and offline-download app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend & Network
  supabase_flutter: ^2.5.4
  connectivity_plus: ^6.0.3

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: 0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Audio & Services
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  audio_session: ^0.1.19

  # Networking & HTTP Downloads
  http: ^1.2.1

  # Security & Encryption
  cryptography: ^2.7.2
  flutter_secure_storage: ^9.2.2

  # UI, Images & Routing
  cached_network_image: ^3.3.1
  go_router: ^14.1.4
  palette_generator: ^0.3.3+3
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/songs_cloud_catalog.json
